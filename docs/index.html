<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>2048 Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="page">

    <div id="header">
        <h1 id="title">2048</h1>

        <div id="instructions">
            Use the arrow keys to move the tiles. Combine matching methods to reach 2048!
        </div>

        <div id="score-box">
            <div id="score-label">SCORE</div>
            <div id="score-value">0</div>
        </div>
    </div>

    <div id="game-container">
        <div id="game-area">
            <canvas id="gameCanvas" width="555" height="555"></canvas>
        </div>

        <img id="graphicKey" src="assets/graphicKey.png">
    </div>

</div>


<script src="game.js"></script>
</body>
</html>
